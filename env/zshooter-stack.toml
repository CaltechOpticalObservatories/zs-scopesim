[python]
constraint = ">=3.10,<3.15"
recommended = "3.14"

[paths]
src_dir = "~/src"

[repos.scopesim]
url = "https://github.com/CaltechOpticalObservatories/ScopeSim.git"
path = "ScopeSim"
relative_to = "src_dir"
ref = "4830d68ace8a600885bfd2e06c1f341a6766c534"
editable = true
managed = true

[repos.irdb]
url = "https://github.com/CaltechOpticalObservatories/irdb.git"
path = "irdb"
relative_to = "src_dir"
ref = "d1415c4a6bdad7d3ce0fdee58e17cd9d2424cc8d"
editable = true
managed = true

[repos.zsdrp]
url = "https://github.com/CaltechOpticalObservatories/zshooter-drp.git"
path = "zshooter-drp"
relative_to = "src_dir"
ref = "f02a53962be554cd6bf56ca50e7e47df5991fe27"
editable = true
managed = true

[repos.zs_scopesim]
path = "."
relative_to = "repo"
ref = "main"
editable = true
managed = false

[local.palace]
path = "PALACE"
editable = true

[pip]
packages = [
  "scopesim_templates",
  "spextra",
  "skycalc_ipy",
  "pyckles",
  "jupyterlab",
  "ipykernel",
  "astropy",
  "scipy",
  "numpy",
  "yappi",
  "pandas",
  "ipydatagrid",
  "pytest",
  "ipywidgets",
  "IProgress",
  "jupyter",
  "h5py",
  "wget"

]
