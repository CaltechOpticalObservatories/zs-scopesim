[python]
constraint = ">=3.12,<3.15"
recommended = "3.14"

[paths]
src_dir = "~/src"

[repos.scopesim]
url = "https://github.com/CaltechOpticalObservatories/ScopeSim.git"
path = "ScopeSim"
relative_to = "src_dir"
ref = "a0495f72a52b01a4bc52bc013b0bd43a4f1bc4be"
editable = true
managed = true

[repos.irdb]
url = "https://github.com/CaltechOpticalObservatories/irdb.git"
path = "irdb"
relative_to = "src_dir"
ref = "8c01711834fe54963c349619308e67b44efbdf81"
editable = true
managed = true

[repos.zsdrp]
url = "https://github.com/CaltechOpticalObservatories/zshooter-drp.git"
path = "zshooter-drp"
relative_to = "main"
ref = "main"
editable = true
managed = true

[repos.zs_scopesim]
path = "."
relative_to = "repo"
ref = "main"
editable = true
managed = false

[local.palace]
path = "PALACE"
editable = true

[pip]
packages = [
  "scopesim_templates",
  "spextra",
  "skycalc_ipy",
  "pyckles",
  "jupyterlab",
  "ipykernel",
  "astropy",
  "scipy",
  "numpy",
  "yappi",
  "pandas",
  "ipydatagrid",
  "pytest",
  "ipywidgets",
  "IProgress",
  "jupyter",
  "h5py",
  "wget"

]
