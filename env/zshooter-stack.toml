[python]
constraint = ">=3.12,<3.15"
recommended = "3.14"

[paths]
src_dir = "~/src"

[repos.scopesim]
url = "https://github.com/CaltechOpticalObservatories/ScopeSim.git"
path = "ScopeSim"
relative_to = "src_dir"
ref = "fd14b0906d5dc0e3693221cfa1a3f5cd7a8afc13"
editable = true
managed = true

[repos.irdb]
url = "https://github.com/CaltechOpticalObservatories/irdb.git"
path = "irdb"
relative_to = "src_dir"
ref = "119551c458ae32186366de12f74beb3669d2cbf9"
editable = true
managed = true

[repos.zsdrp]
url = "https://github.com/CaltechOpticalObservatories/zshooter-drp.git"
path = "zshooter-drp"
relative_to = "src_dir"
ref = "31ecacadcae6c34a9411cc4548ace0dd671e42b9"
editable = true
managed = true

[repos.pyreduce]
url = "https://github.com/CaltechOpticalObservatories/PyReduce.git"
path = "PyReduce-xshooter"
relative_to = "src_dir"
ref = "dd159530d64fefad908739c193f6c3493792d276"
editable = true
managed = true

[repos.zs_scopesim]
path = "."
relative_to = "repo"
ref = "main"
editable = true
managed = false

[local.palace]
path = "PALACE"
editable = true

[pip]
packages = [
  "scopesim_templates",
  "spextra",
  "skycalc_ipy",
  "pyckles",
  "jupyterlab",
  "ipykernel",
  "astropy",
  "scipy",
  "numpy",
  "yappi",
  "pandas",
  "ipydatagrid",
  "pytest",
  "ipywidgets",
  "IProgress",
  "jupyter",
  "h5py",
  "wget"

]
