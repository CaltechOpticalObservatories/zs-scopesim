[python]
constraint = ">=3.12,<3.15"
recommended = "3.14"

[paths]
src_dir = "~/src"

[repos.scopesim]
url = "https://github.com/CaltechOpticalObservatories/ScopeSim.git"
path = "ScopeSim"
relative_to = "src_dir"
ref = "aef3a53debb21d6edd92e20e3702e54f5fb57d05"
editable = true
managed = true

[repos.irdb]
url = "https://github.com/CaltechOpticalObservatories/irdb.git"
path = "irdb"
relative_to = "src_dir"
ref = "8c01711834fe54963c349619308e67b44efbdf81"
editable = true
managed = true

[repos.zsdrp]
url = "https://github.com/CaltechOpticalObservatories/zshooter-drp.git"
path = "zshooter-drp"
relative_to = "src_dir"
ref = "dbf6e3a0b733064d6bd71a6d531feb89c3a8a870"
editable = true
managed = true

[repos.pyreduce]
url = "https://github.com/ivh/PyReduce.git"
path = "PyReduce-xshooter"
relative_to = "src_dir"
ref = "26a8f2b04aa03a5d7224b07cc6888ebc52001133"
editable = true
managed = true

[repos.zs_scopesim]
path = "."
relative_to = "repo"
ref = "main"
editable = true
managed = false

[local.palace]
path = "PALACE"
editable = true

[pip]
packages = [
  "scopesim_templates",
  "spextra",
  "skycalc_ipy",
  "pyckles",
  "jupyterlab",
  "ipykernel",
  "astropy",
  "scipy",
  "numpy",
  "yappi",
  "pandas",
  "ipydatagrid",
  "pytest",
  "ipywidgets",
  "IProgress",
  "jupyter",
  "h5py",
  "wget"

]
