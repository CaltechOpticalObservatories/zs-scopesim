[python]
constraint = ">=3.12,<3.15"
recommended = "3.14"

[paths]
src_dir = "~/src"

[repos.scopesim]
url = "https://github.com/CaltechOpticalObservatories/ScopeSim.git"
path = "ScopeSim"
relative_to = "src_dir"
ref = "e2cefad8838f9db7ccffd9b131169c48b79f04a1"
editable = true
managed = true

[repos.irdb]
url = "https://github.com/CaltechOpticalObservatories/irdb.git"
path = "irdb"
relative_to = "src_dir"
ref = "9884ea7429a480dfd63672c5b6e408f4d431f921"
editable = true
managed = true

[repos.zsdrp]
url = "https://github.com/CaltechOpticalObservatories/zshooter-drp.git"
path = "zshooter-drp"
relative_to = "src_dir"
ref = "e7bfd5a91770fe1ee47e11dcd2a170752d15a744"
editable = true
managed = true

[repos.pyreduce]
url = "https://github.com/ivh/PyReduce.git"
path = "PyReduce-xshooter"
relative_to = "src_dir"
ref = "26a8f2b04aa03a5d7224b07cc6888ebc52001133"
editable = true
managed = true

[repos.zs_scopesim]
path = "."
relative_to = "repo"
ref = "main"
editable = true
managed = false

[local.palace]
path = "PALACE"
editable = true

[pip]
packages = [
  "scopesim_templates",
  "spextra",
  "skycalc_ipy",
  "pyckles",
  "jupyterlab",
  "ipykernel",
  "astropy",
  "scipy",
  "numpy",
  "yappi",
  "pandas",
  "ipydatagrid",
  "pytest",
  "ipywidgets",
  "IProgress",
  "jupyter",
  "h5py",
  "wget"

]
