[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-scopesim"
version = "0.1.0"
description = "ZShooter simulator notebooks, documentation, and workflow tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "ZShooter Team" },
]
dependencies = [
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
dev = [
  "black",
  "pytest",
  "ruff",
]
docs = [
  "myst-parser",
  "sphinx",
  "sphinx-book-theme",
]
notebooks = [
  "ipykernel",
  "jupyterlab",
]

[project.scripts]
zs-sim = "zs_scopesim_tools.cli:main"

[project.urls]
Repository = "https://github.com/CaltechOpticalObservatories/zs-scopesim"

[tool.setuptools.packages.find]
where = ["src"]
