alias: ZShooter

instrument:
  name: ZShooter
  description: Multi-Channel Spectrograph for Keck
  telescope: keck
  modes:
    - SPECTRO_MODE
  effects:
    - name: detector_array
      class: DetectorList
      type: detector
      kwargs:
        array_dict:
          id: [1]
          x_cen: [0]
          y_cen: [0]
          x_size: [16]
          y_size: [16]
          pixel_size: [1.0]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: mm
        y_size_unit: mm
        pixsize_unit: mm
        angle_unit: deg
        gain_unit: electron/adu

    - name: primary_mirror
      class: Mirror
      kwargs:
        shape: circular
        diameter: 10.0

    - name: disperser
      class: Disperser
      kwargs:
        dispersion: 0.3
        wavelength_range: [0.6, 1.0]