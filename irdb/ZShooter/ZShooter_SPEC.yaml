### Common effects list for ZShooter

object: instrument
alias: INST
name: ZShooter
description: Effects from the ZShooter optics

properties:
  decouple_detector_from_sky_headers: True  # needed for slit spectroscopy
  dichroic_names:
    - dichroic1
    - dichroic2

effects:
 - name: dichroic_tree
   description: ZShooter dichroic tree
   class: DichroicTreeEffect
   include: True
   kwargs:
     tree_filename: "dichroics/dichroic_tree.dat"
     dichroic_names: "!INST.dichroic_names"
     filename_format: "dichroics/TER_{}.dat"

 - name: slit_nir
   description: ZShooter NIR slit
   class: FoVSpecificAperture
   include: True
   kwargs:
     fov_ids: [0]
     filename: "slits/slit_nir.dat"

 - name: slit_vis
   description: ZShooter VIS slit
   class: FoVSpecificAperture
   include: True
   kwargs:
     fov_ids: [1]
     filename: "slits/slit_vis.dat"

 - name: slit_uvb
   description: ZShooter UVB slit
   class: FoVSpecificAperture
   include: True
   kwargs:
     fov_ids: [2]
     filename: "slits/slit_uvb.dat"

 - name: trace_eff
   description: list of spectral order trace efficiencies
   class: SpectralEfficiency
   include: True
   kwargs:
     filename: "traces/TRACE_eff.fits"

 - name: trace_list
   description: list of spectral order trace geometry on the focal plane
   class: SpectralTraceList
   include: True
   kwargs:
     filename: "traces/TRACE_ZSHOOTER.fits"
     wave_colname: "wavelength"
     s_colname: "s"
     col_number_start: 1

 - name: detector_qe
   description: QE curve for new OSIRIS detector, placeholder for ZShooter
   class: QuantumEfficiencyCurve
   include: True
   kwargs:
     filename: "QE.dat"
