### ZShooter DETECTOR
object : detector
alias : DET
name : zshooter_detectors
description : Three 4k detectors

properties :
    image_plane_id : 0
    temperature : -120
    binx : 1
    biny: 1
    dit : "!OBS.dit"
    ndit : "!OBS.ndit"

effects :
  - name: detector_nir
    description: Single 4k x 4k detector for ZShooter NIR arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        array_dict:
          id: [0, 1]
          x_cen: [-30.72, 30.72]
          y_cen: [0.0, 0.0]
          x_size: [2048, 4096]
          y_size: [2048, 4096]
          pixel_size: [0.015, 0.015]
          angle: [0.0, 0.0]
          gain: [1.0, 1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu

  - name: detector_vis
    description: Single 4k x 4k detector for ZShooter VIS arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 1
        array_dict:
          id: [1]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [4096]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu

  - name: detector_uvb
    description: Single 4k x 4k detector for ZShooter UVB arm
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 2
        array_dict:
          id: [2]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [4096]
          pixel_size: [0.015]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu

  - name: exposure_integration
    description: Summing up sky signal for all DITs and NDITs
    class: ExposureIntegration

  - name: dark_current
    description : OSIRIS dark current
    class: DarkCurrent
    # [e-/s] level of dark current for each detector
    kwargs:
        value: 0.0001

  - name: shot_noise
    description : apply poisson shot noise to images
    class: ShotNoise

  - name: detector_linearity
    description : Linearity characteristics of OSIRIS chip
    class: LinearityCurve
    include: False
    kwargs:
        array_dict:
          incident: [0, 64e3]
          measured: [0, 64e3]

  - name: border_reference_pixels
    description: Blanks the signal on N edge row and column pixels
    class: ReferencePixelBorder
    kwargs:
        left:  50
#        right: 50 #New CCD only has prescan, no overscan

  - name : readout_noise
    description : Readout noise frames
    class : BasicReadoutNoise
    kwargs :
        noise_std : 2


  - name: binning
    description: Applies binning
    class: UnequalBinnedImage
    include: False
    kwargs:
        binx: "!DET.binx"
        biny: "!DET.biny"

  - name : bias
    description : Bias level
    class : Bias
    kwargs :
        bias : 1040

